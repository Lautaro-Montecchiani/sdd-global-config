schema: spec-driven

context: |
  project_type: tooling
  Propósito: gestionar la configuración global del workflow SDD Híbrido (Claude + Agente).
  Artefactos gestionados:
    - ~/.claude/CLAUDE.md (reglas globales para Claude)
    - ~/.claude/skills/ y ~/.claude/commands/opsx/ (comportamiento de explore/propose/apply/verify/archive en Claude)
    - openspec/config.yaml de cada proyecto (contexto e inyección por proyecto)
  Workflow: Claude = arquitecto (propose/verify/archive). Agente = constructor (apply).
  El Agente puede ser Antigravity (.agents/skills/, ~/.gemini/) o Cursor (.cursor/commands/, .cursor/rules/), con .github/skills/ para Copilot.
  
  ## Tests
  - comando: pwsh -NoProfile -File tests/ejecutar.ps1
  - timeout: 5

  ## Glosario
  - Change: unidad de trabajo de OpenSpec, con proposal, design, specs y tasks
  - Capability: área funcional con su spec vigente en openspec/specs/<capability>/spec.md
  - Delta spec: cambios de un change sobre una spec (ADDED / MODIFIED / REMOVED / RENAMED)
  - Handoff: aviso de Claude al Agente para que implemente un change
  - ODD: flujo liviano para cambios que no tocan specs, datos, seguridad ni contratos, con un único documento en docs/odd/<nombre>.md
  - Clasificación: decisión ODD o SDD con los criterios K1 a K10 del CLAUDE.md global
  - Escalado: paso de un ODD a SDD cuando aparece un criterio SDD
  - Test Plan: sección del design.md con un ID por escenario (Sxx) y su verificación
  - Caracterización (Cxx): test que fija el comportamiento actual de código que se modifica
  - Spec-ID: trailer de commit que vincula el commit con su change
  - Vault: repo Obsidian compartido con el contexto de los proyectos (context.md, notas)
  - Espejo: copia de solo lectura del CLAUDE.md global en el vault
  - Nivel de arquitectura: escalón de la escalera 0 a 3 (0, 1-nucleo-funcional, 2-tuberias, 2-capas, 3-hexagonal, 3-modular), declarado con la clave nivel en ## Arquitectura
  - Receta: guía de un nivel con señales, carpetas tipo, reglas no importa:, mínimo de reglas, pautas para el Agente y cuándo no aplicarla
  - Señal: evidencia concreta en el código (por ejemplo, un archivo que mezcla I/O y cálculos) que justifica recomendar subir de nivel
  - Ficha del proyecto: descripción, objetivos, alcance, datos y stack de un proyecto, declarados en el context: de openspec/config.yaml y completados con /ficha
  - Alcance: versión del proyecto con lo que incluye y lo que no incluye todavía, en ## Alcance
  - Dato personal: dato de una persona identificable (Ley 25.326), declarado como personal en ## Datos; activa los controles de datos personales de la Security Layer
  - Puerta de integración: tres preguntas del verify (dato inesperado, seguridad y explicabilidad) que tienen que dar sí para integrar código
  - ADR: registro de una decisión de arquitectura que dura más que un change, en docs/adr/NNNN-<slug>.md del proyecto
  - Atributo de calidad: objetivo de rendimiento, disponibilidad, escalabilidad, costo o mantenibilidad, con prioridad, en ## Calidad
  - Visión: documento vivo docs/arquitectura/vision.md con componentes, decisiones vigentes y hoja de ruta
  - Revisión de impacto: sección ## Impacto en el sistema del design.md

  ## Actores y Procesos de Negocio
  ### Actores
  - Usuario del workflow: colaborador que trabaja en los proyectos con Claude Code y el Agente
  - Claude (arquitecto de software): explora, propone, verifica y archiva changes, y lleva los ADRs, la visión y la revisión de impacto; no escribe código de producción
  - Agente (constructor): implementa los changes con /openspec-apply-change (Cursor, Antigravity, Copilot u otro)
  - Mantenedor de sdd-global-config: edita reglas globales, skills y comandos y los distribuye
  ### Procesos
  - Ciclo de un change: explore, propose, apply, verify y archive, con PR y merge antes del archive
  - Onboarding de proyecto: openspec init --tools <agente>, config.yaml y scripts/sincronizar-proyecto.ps1
  - Setup de máquina: clonar el repo y el vault y correr scripts/instalar.ps1
  - Sincronización de reglas: CLAUDE.md global, espejo del vault y copia en el repo
  - Generación del SRS: srs-generate a partir de las specs vigentes

  ## Objetivos de Negocio
  - U-01: arrancar un proyecto nuevo con el workflow sin configurar a mano
  - U-02: saber en todo momento qué change está activo y en qué estado (context.md del vault)
  - U-03: que el verify diga con evidencia si un change está listo para archivar
  - OBJ-01: todo cambio de código pasa por una spec aprobada (SDD) o un documento ODD aprobado antes de implementarse
  - OBJ-02: separar diseño (Claude) de implementación (Agente) con un handoff explícito
  - OBJ-03: verificar con tests ejecutados, no por inferencia, antes de archivar
  - OBJ-04: reglas replicables entre máquinas y personas (repo + vault compartido)
  - OBJ-05: documentación de requisitos generada desde las specs, sin redactarla a mano
  - OBJ-06: decisiones de arquitectura, atributos de calidad y deuda técnica registrados y revisados en cada change

  ## Arquitectura
  - scripts/: generación de plantillas, instalación y sincronización (PowerShell 7)
  - skills/: skills de Claude que se instalan en ~/.claude/skills/
  - templates/: plantillas de reglas para agentes no-Claude
  - tests/: tests de los scripts

rules:
  proposal:
    - Incluir sección "Non-goals" para delimitar el alcance
    - Indicar qué archivo global se modifica y por qué
  tasks:
    - Cada tarea debe referenciar la ruta exacta del archivo a modificar
    - Si el change afecta a otros proyectos (skills, comandos, CLAUDE.md global o configuración global), la última tarea debe ser "Verificar que el cambio aplica en un proyecto de prueba"; los changes que solo modifican documentación de este repositorio quedan exentos
  design:
    - Incluir sección "## Impacto en proyectos existentes" para evaluar retrocompatibilidad
